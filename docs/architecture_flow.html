<h2 class="sr-only">Interactive diagram of the Chop Now microservices architecture, stepping through four stages of an order's lifecycle</h2>
<style>
.stagebar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:.75rem}
.stagebtn{border:0.5px solid var(--border-strong);border-radius:999px;padding:6px 14px;font-size:13px;background:var(--surface-2);cursor:pointer}
.stagebtn.on{background:var(--bg-accent);border-color:var(--border-accent);color:var(--text-accent)}
.desc{font-size:13px;color:var(--text-secondary);margin:0 0 1rem}
.flow{stroke-dasharray:6 4}
@media (prefers-reduced-motion: no-preference){.flow{animation:dash 0.9s linear infinite}}
@keyframes dash{to{stroke-dashoffset:-20}}
</style>
<div class="stagebar" id="bar"></div>
<p class="desc" id="desc"></p>
<svg width="100%" viewBox="0 0 680 380" role="img">
<title>Chop Now order lifecycle across services</title>
<desc>Animated diagram showing four stages: registration, order and payment, delivery, and live WebSocket updates, across nine backend services connected by RabbitMQ.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="node-box" data-stages="1 2 4"><rect class="box" x="260" y="20" width="160" height="40" rx="8" stroke-width="0.5"/><text class="th" x="340" y="40" text-anchor="middle" dominant-baseline="central">Browser</text></g>
<g class="node-box" data-stages="1 2"><rect class="box" x="40" y="84" width="560" height="40" rx="8" stroke-width="0.5"/><text class="th" x="320" y="104" text-anchor="middle" dominant-baseline="central">Frontend — nginx / Caddy</text></g>

<g class="node-box c-blue" data-stages="1"><rect x="50" y="154" width="110" height="44" rx="8" stroke-width="0.5"/><text class="th" x="105" y="176" text-anchor="middle" dominant-baseline="central">Auth</text></g>
<g class="node-box c-blue" data-stages="2"><rect x="180" y="154" width="110" height="44" rx="8" stroke-width="0.5"/><text class="th" x="235" y="176" text-anchor="middle" dominant-baseline="central">Order</text></g>
<g class="node-box c-blue" data-stages="2"><rect x="310" y="154" width="110" height="44" rx="8" stroke-width="0.5"/><text class="th" x="365" y="176" text-anchor="middle" dominant-baseline="central">Payment</text></g>
<g class="node-box c-blue" data-stages="3"><rect x="440" y="154" width="110" height="44" rx="8" stroke-width="0.5"/><text class="th" x="495" y="176" text-anchor="middle" dominant-baseline="central">Shipping</text></g>

<g class="node-box c-purple" data-stages="1 2 3 4"><rect x="40" y="228" width="560" height="40" rx="8" stroke-width="0.5"/><text class="th" x="320" y="248" text-anchor="middle" dominant-baseline="central">RabbitMQ</text></g>

<g class="node-box c-teal" data-stages="3"><rect x="110" y="298" width="170" height="56" rx="10" stroke-width="0.5"/><text class="th" x="195" y="318" text-anchor="middle" dominant-baseline="central">Notification</text><text class="ts" x="195" y="336" text-anchor="middle" dominant-baseline="central">Sends emails via Resend</text></g>
<g class="node-box c-teal" data-stages="4"><rect x="320" y="298" width="170" height="56" rx="10" stroke-width="0.5"/><text class="th" x="405" y="318" text-anchor="middle" dominant-baseline="central">Realtime</text><text class="ts" x="405" y="336" text-anchor="middle" dominant-baseline="central">Pushes live status</text></g>

<g id="edges1"><line class="arr flow" x1="330" y1="60" x2="330" y2="84" marker-end="url(#arrow)"/><line class="arr flow" x1="105" y1="124" x2="105" y2="154" marker-end="url(#arrow)"/><line class="arr flow" x1="105" y1="198" x2="105" y2="228" marker-end="url(#arrow)"/></g>
<g id="edges2" style="display:none"><line class="arr flow" x1="330" y1="60" x2="330" y2="84" marker-end="url(#arrow)"/><line class="arr flow" x1="235" y1="124" x2="235" y2="154" marker-end="url(#arrow)"/><line class="arr flow" x1="290" y1="176" x2="310" y2="176" marker-end="url(#arrow)"/><line class="arr flow" x1="365" y1="198" x2="365" y2="228" marker-end="url(#arrow)"/></g>
<g id="edges3" style="display:none"><line class="arr flow" x1="495" y1="228" x2="495" y2="198" marker-end="url(#arrow)"/><line class="arr flow" x1="520" y1="198" x2="520" y2="228" marker-end="url(#arrow)"/><line class="arr flow" x1="195" y1="268" x2="195" y2="298" marker-end="url(#arrow)"/></g>
<g id="edges4" style="display:none"><line class="arr flow" x1="405" y1="268" x2="405" y2="298" marker-end="url(#arrow)"/><path class="arr flow" fill="none" d="M490,326 L615,326 L615,40 L420,40" marker-end="url(#arrow)" stroke-dasharray="4 4"/></g>
</svg>
<script>
const stages={1:"Register: browser hits Auth through the gateway; a user.registered event lands on RabbitMQ.",2:"Order and pay: checkout verifies price with Order, Payment talks to Paystack, then publishes payment.succeeded.",3:"Delivery: Shipping is auto-created off that event, dispatches, and Notification emails the customer at each step.",4:"Live update: Realtime is subscribed to the same events and pushes the new status straight to the open browser tab."};
const bar=document.getElementById('bar');
Object.keys(stages).forEach(n=>{const b=document.createElement('button');b.className='stagebtn'+(n=='1'?' on':'');b.textContent=n+'. '+({1:'Register',2:'Order & pay',3:'Delivery',4:'Live update'}[n]);b.onclick=()=>setStage(n);bar.appendChild(b);});
function setStage(n){
 document.querySelectorAll('.stagebtn').forEach((b,i)=>b.classList.toggle('on',String(i+1)===String(n)));
 document.getElementById('desc').textContent=stages[n];
 document.querySelectorAll('[id^=edges]').forEach(g=>g.style.display=g.id==='edges'+n?'block':'none');
 document.querySelectorAll('.node-box').forEach(el=>{el.style.opacity=el.dataset.stages.split(' ').includes(String(n))?'1':'0.35'});
}
setStage(1);
</script>
