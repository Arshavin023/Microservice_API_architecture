          RABBITMQ_URL: amqp://test_user:test_password@localhost:5672/
          # Tests read PAYSTACK_SECRET_KEY at import time via webhook.py.
          # Use a known test value — tests compute signatures against this same key.
          PAYSTACK_SECRET_KEY: ci-test-paystack-secret-not-real
