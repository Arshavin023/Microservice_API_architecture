services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    restart: always

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

    ports:
      - "5672:5672"
      - "15672:15672"

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  auth-service:
    build: ./auth-service
    container_name: auth-service
    restart: always

    depends_on:
      rabbitmq:
        condition: service_healthy

    env_file:
      - .env

    environment:
      DATABASE_URL: ${AUTH_DATABASE_URL}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "8001:8000"

    volumes:
      - ./auth-service:/app

  user-service:
    build: ./user-service
    container_name: user-service
    restart: always

    depends_on:
      rabbitmq:
        condition: service_healthy

    env_file:
      - .env

    environment:
      DATABASE_URL: ${USER_DATABASE_URL}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "8002:8000"

    volumes:
      - ./user-service:/app

  # Separate process from user-service's API container — same image,
  # different command. Consumes RabbitMQ events independently of HTTP
  # traffic, so the two workloads can be scaled/restarted independently.
  user-service-worker:
    build: ./user-service
    container_name: user-service-worker
    restart: always

    depends_on:
      rabbitmq:
        condition: service_healthy

    env_file:
      - .env

    environment:
      DATABASE_URL: ${USER_DATABASE_URL}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./user-service:/app

    command: ["python", "-m", "app.workers.consumer"]

  product-service:
    build: ./product-service
    container_name: product-service
    restart: always

    env_file:
      - .env

    environment:
      DATABASE_URL: ${PRODUCT_DATABASE_URL}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "8003:8000"

    volumes:
      - ./product-service:/app

  order-service:
    build: ./order-service
    container_name: order-service
    restart: always

    depends_on:
      rabbitmq:
        condition: service_healthy

    env_file:
      - .env

    environment:
      DATABASE_URL: ${ORDER_DATABASE_URL}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      PRODUCT_SERVICE_URL: http://product-service:8000
      PAYMENT_SERVICE_URL: http://payment-service:8000

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "8004:8000"

    volumes:
      - ./order-service:/app
    
  order-service-worker:
    build: ./order-service
    container_name: order-service-worker
    restart: always

    depends_on:
      rabbitmq:
        condition: service_healthy

    env_file:
      - .env

    environment:
      DATABASE_URL: ${ORDER_DATABASE_URL}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./order-service:/app

    command: ["python", "-m", "app.workers.consumer"]

  frontend:
    build: ./frontend
    container_name: frontend
    restart: always
    depends_on:
      - auth-service
      - user-service
      - product-service
      - order-service
      - payment-service
    ports:
      - "3000:80"
  payment-service:
    build: ./payment-service
    container_name: payment-service
    restart: always

    depends_on:
      rabbitmq:
        condition: service_healthy

    env_file:
      - .env

    environment:
      DATABASE_URL: ${PAYMENT_DATABASE_URL}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      ORDER_SERVICE_URL: http://order-service:8000
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "8005:8000"

    volumes:
      - ./payment-service:/app
  
  shipping-service:
    build: ./shipping-service
    container_name: shipping-service
    restart: always

    depends_on:
      rabbitmq:
        condition: service_healthy

    env_file:
      - .env

    environment:
      DATABASE_URL: ${SHIPPING_DATABASE_URL}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      JWT_SECRET:   ${JWT_SECRET}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "8006:8000"

    volumes:
      - ./shipping-service:/app

  notification-service:
    build: ./notification-service
    container_name: notification-service
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL:          ${NOTIFICATION_DATABASE_URL}
      RABBITMQ_URL:          amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      USER_SERVICE_URL:      http://user-service:8000
      AWS_REGION:            ${AWS_REGION}
      SES_SENDER_EMAIL:      ${SES_SENDER_EMAIL}
      AWS_ACCESS_KEY_ID:     ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./notification-service:/app
      
volumes:
  rabbitmq_data:
